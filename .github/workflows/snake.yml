
name: Generate contribution snake

on:
  workflow_dispatch:
  schedule:
    - cron: "15 3 * * *"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Generate animated SVGs
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: Daksh-Aggarwal
          outputs: |
            dist/github-snake.svg?palette=github-light&color_snake=%238B5CF6
            dist/github-snake-dark.svg?palette=github-dark&color_snake=%23A78BFA

      - name: Publish SVGs
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
